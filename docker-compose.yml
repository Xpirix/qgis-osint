services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-osint_matrix}
      - POSTGRES_USER=${POSTGRES_USER:-qgis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=${REDIS_URL:-redis://cache:6379/0}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROXY_CACHE_TTL=${PROXY_CACHE_TTL:-3600}
      - FETCH_INTERVAL_COMMITS=${FETCH_INTERVAL_COMMITS:-300}
      - FETCH_INTERVAL_RSS=${FETCH_INTERVAL_RSS:-900}
      - FETCH_INTERVAL_PLUGINS=${FETCH_INTERVAL_PLUGINS:-600}
      - FETCH_INTERVAL_HUB=${FETCH_INTERVAL_HUB:-1800}
      - FETCH_INTERVAL_ANALYTICS=${FETCH_INTERVAL_ANALYTICS:-86400}
      - FETCH_INTERVAL_SCRAPE=${FETCH_INTERVAL_SCRAPE:-86400}
      - FETCH_INTERVAL_LAYERS=${FETCH_INTERVAL_LAYERS:-3600}
      - DATA_DIR=/app/data
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - web
      - internal

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-qgis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-osint_matrix}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qgis} -d ${POSTGRES_DB:-osint_matrix}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
